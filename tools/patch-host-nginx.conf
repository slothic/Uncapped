# Static patch host for the Uncapped launcher.
#
# Design rule: this server can only ever emit files whose names match the
# allowlist regex below, read from a directory that contains nothing else.
# There is no autoindex, no PHP, no upstream, no fallback root. Everything that
# is not an exact match for a published patch filename is a 404.

worker_processes 2;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version to anyone scanning the IP.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 30;

    # Large files, slow clients: do not let a stalled download hold a worker forever.
    send_timeout        120s;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Nothing is ever uploaded to this server over HTTP.
    client_max_body_size 1k;

    log_format patches '$remote_addr $time_iso8601 "$request" $status $body_bytes_sent '
                       'range="$http_range" ua="$http_user_agent"';
    access_log /var/log/nginx/patches.log patches;

    # One IP should not be able to occupy every worker. The launcher runs at most
    # six concurrent downloads and only two of them come from here, so 6 is
    # generous for a real player and still bounds a single abusive host.
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        autoindex off;

        # ---- The only thing this server serves -------------------------------
        #
        # The captured group cannot contain '/', and nginx has already collapsed
        # any '.' / '..' segments and decoded %2f before location matching runs,
        # so there is no path that escapes /srv/patches. A name that merely looks
        # like traversal is just a filename that does not exist -> 404.
        location ~ "^/patches/(?<mpq>patch-enUS-[0-9A-Z]-[A-Za-z0-9.\-]+\.MPQ)$" {
            limit_conn perip 6;
            # Anything but a read is a 404, not a 403: a 403 would confirm the
            # filename exists, which is exactly what a prober is asking.
            if ($request_method !~ ^(GET|HEAD)$) { return 404; }

            alias /srv/patches/$mpq;

            # Published filenames carry their version, so the bytes behind a URL
            # never change. Safe to cache hard, and safe for a client that
            # resumes hours later: it cannot be handed a mix of two releases.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;

            # (Accept-Ranges: bytes is emitted by nginx itself for static files --
            # setting it here as well produced a duplicate header.)

            types { } default_type application/octet-stream;
        }

        # ---- The patched client executable and its runtime DLL ---------------
        #
        # Same rule as the archives above: an explicit allowlist, not a wildcard.
        # The name must begin with one of the two artefacts we publish, carry a
        # version, and end in .dat or .dll -- so this location can never serve a
        # file that merely happens to be in the directory.
        #
        # .dat rather than .exe for the client: the launcher renames it that way
        # so players cannot start an unsynced client by double-clicking, and
        # serving it under the name it lands as keeps the two in step.
        location ~ "^/patches/(?<runtime>Uncapped(?:Client|CT)-[A-Za-z0-9.\-]+\.(?:dat|dll))$" {
            limit_conn perip 6;
            if ($request_method !~ ^(GET|HEAD)$) { return 404; }

            alias /srv/patches/$runtime;

            # Versioned filenames, so the bytes behind a URL never change.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;

            types { } default_type application/octet-stream;
        }

        # ---- The stock 3.3.5a client archive ----------------------------------
        #
        # Mirrored from the Internet Archive so client acquisition does not depend
        # on a third party we do not control. Added 2026-08-13 after a player's
        # install failed four times running: every failure was a TLS stream dying
        # mid-transfer against archive.org, never against this host.
        #
        # Same allowlist discipline as the archives above -- an exact name shape,
        # not a wildcard -- so this block can only ever serve the client zips.
        location ~ "^/patches/(?<clientzip>3\.3\.5-12340_[A-Za-z]+\.zip)$" {
            limit_conn perip 6;
            if ($request_method !~ ^(GET|HEAD)$) { return 404; }

            alias /srv/patches/$clientzip;

            # The build is in the name and the bytes never change, so this is as
            # safe to cache hard as the versioned archives.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;

            types { } default_type application/octet-stream;
        }

        # ---- The server-generated client item cache ---------------------------
        #
        # Same allowlist rule as the two above: an explicit name shape, not a
        # wildcard. itemcache-<version>.wdb.gz only -- the launcher installs it
        # into Cache\WDB\<locale>\itemcache.wdb after verifying both the gzip
        # hash and the decompressed content hash from the manifest, so a wrong or
        # truncated body is rejected client-side rather than trusted.
        location ~ "^/patches/(?<itemcache>itemcache-[A-Za-z0-9.\-]+\.wdb\.gz)$" {
            limit_conn perip 6;
            if ($request_method !~ ^(GET|HEAD)$) { return 404; }

            alias /srv/patches/$itemcache;

            # Versioned filenames, so the bytes behind a URL never change.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;

            types { } default_type application/octet-stream;
        }

        # ---- The stock client, for Repair ------------------------------------
        #
        # baseline.json describes what a legitimate Uncapped client is made of; these
        # are the bytes the launcher fetches when one of those files is missing or has
        # been altered. Flat directory, one file per baseline entry, named
        # <flattened-path>-<build>.<ext> -- so Data/enUS/base-enUS.MPQ is served as
        # Data-enUS-base-enUS-12340.MPQ and cannot collide with a Data/base-enUS.MPQ.
        #
        # Same allowlist discipline as everything above: the captured group cannot
        # contain '/', and the name MUST carry a -<digits> build suffix before its
        # extension. A request for anything else is a 404, including for a file that
        # happens to be sitting in the directory under a different name.
        location ~ "^/base/(?<asset>[A-Za-z0-9._\-]+-[0-9]{4,6}\.(?:MPQ|dll|exe))$" {
            limit_conn perip 6;
            if ($request_method !~ ^(GET|HEAD)$) { return 404; }

            alias /srv/patches/base/$asset;

            # The build number is in the name, so these bytes are immutable. Matters
            # more here than for the patches: a repair can be a 4 GB download and a
            # client that resumes it hours later must not be handed a different build.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;

            types { } default_type application/octet-stream;
        }

        # ---- The baseline itself ---------------------------------------------
        #
        # Deliberately NOT cached: this is the one file that changes when the checked
        # scope changes, and it is the off switch if the integrity check ever starts
        # flagging something legitimate. A cached copy would mean waiting out a CDN to
        # correct a false accusation.
        location = /baseline.json {
            limit_conn perip 6;
            if ($request_method !~ ^(GET|HEAD)$) { return 404; }

            alias /srv/patches/baseline.json;

            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            default_type application/json;
        }

        # ---- Liveness, for the publish script and for monitoring -------------
        location = /healthz {
            access_log off;
            add_header Content-Type "text/plain" always;
            return 200 "ok\n";
        }

        # ---- Everything else -------------------------------------------------
        # No directory listing, no root fallback, no error page that leaks a path.
        location / {
            return 404;
        }

    }
}
